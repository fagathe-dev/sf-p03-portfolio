# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $projectDir: '%kernel.project_dir%'
            string $uploadDir: 'uploads'
            # string $environment: '%kernel.environment%'
            # string $defaultUri: '%env(DEFAULT_URI)%'
            # string $appName: '%env(APP_NAME)%'
            # string $defaultLocale: 'fr_FR'
        
    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    
    # core-php : CorePhpBundle (config/bundles.php) déclare ses propres services
    # (logger, uploader, mailer, commandes) avec leurs paramètres. Ne pas réimporter
    # tout vendor/fagathe-dev/core-php/src/ ici : ce fichier étant chargé après le
    # bundle, ses définitions écraseraient celles du bundle (paramètres perdus).
    # On ne déclare que ce que le bundle n'expose pas et que le portfolio utilise.
    Fagathe\CorePhp\File\JsonFileHandler: ~

    Fagathe\CorePhp\Twig\:
        tags: ['twig.extension']
        resource: '../vendor/fagathe-dev/core-php/src/Twig/'

    App\Validator\Constraint\FrenchPhoneValidator:
        tags:
            - { name: 'validator.constraint_validator' }

    # E-mails : handlers App\Mail\* (AbstractMailerHandler de core-php), autowirés.
    # Configuration par les variables lues par core-php (cf. .env) : DEFAULT_EMAIL_SENDER,
    # SUPPORT_EMAIL (destinataire des messages de contact), APP_NAME, DEFAULT_URI, LOGO_PATH.

# Pas de contrôle DNS des destinataires en test (hors ligne, domaines fictifs)
when@test:
    parameters:
        core_php.email.check_deliverability: false